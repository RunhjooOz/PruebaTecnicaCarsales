<div style="padding: 20px;">

  <mat-form-field style="width: 300px;" appearance="outline">
    <mat-label>Filtrar episodios</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." />
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let e">{{ e.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let e">{{ e.name }}</td>
    </ng-container>

    <ng-container matColumnDef="air_date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
      <td mat-cell *matCellDef="let e">{{ e.air_date }}</td>
    </ng-container>

    <ng-container matColumnDef="episode">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Episodio</th>
      <td mat-cell *matCellDef="let e">{{ e.episode }}</td>
    </ng-container>

    <ng-container matColumnDef="url">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>URL</th>
      <td mat-cell *matCellDef="let e">
        <a [href]="e.url" target="_blank" rel="noopener noreferrer">
        {{ e.url }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="characters">
      <th mat-header-cell *matHeaderCellDef>Personajes</th>
      <td mat-cell *matCellDef="let e">
        {{ e.characters.length }} personajes
      </td>
    </ng-container>

    <ng-container matColumnDef="created">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Creado</th>
      <td mat-cell *matCellDef="let e">{{ e.created }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSize]="10"></mat-paginator>

</div>
